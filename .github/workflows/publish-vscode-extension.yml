name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-vscode-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$TAG_NAME" != "v$package_version" ]]; then
            echo "::error::Tag $TAG_NAME must match package.json version v$package_version"
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Check extension
        run: npm run check

      - name: Package VSIX
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          npx --yes @vscode/vsce package --no-dependencies \
            --out "release/vscode-markdown-reader-${VERSION}.vsix"

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx --yes @vscode/vsce publish \
            --packagePath "release/vscode-markdown-reader-${VERSION}.vsix"
